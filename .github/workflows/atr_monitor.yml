name: ATR Trailing Stop Monitor

# ─────────────────────────────────────────────────────────────
# 트리거
#
# GHA schedule 이벤트는 배달률이 18% 다(2026-09-12 실측, 3월부터 13주 연속 하락).
# GitHub 문서도 "some queued jobs may be dropped" 라고 명시한다. 그래서 "정각 실행" 을
# 전제하지 않고, 창(window) 안에서 오늘 아직 안 했으면 하는 멱등 구조로 간다.
# 무슨 작업을 할지는 크론이 아니라 market_hours.due_windows() 가 정한다.
#
# 크론 1개: 10분 간격, 창이 걸리는 UTC 시에만, 비인기 분(:03/:13/…).
#   - 분: GitHub 문서가 "High load times include the start of every hour" 라 하고,
#         실측에서도 :30 이 :00 보다 37% 더 도착했다 → 라운드 시각을 피한다.
#   - 시: market_hours 의 창 정의에서 생성했다(서머타임 양쪽 상태 포함). 창을 고치면
#         이 목록도 다시 생성해야 한다 — tests/test_workflow_cron.py 가 대조한다.
# 하루 84틱(기존 48). 창 밖 틱은 파이썬이 "실행할 창 없음" 으로 즉시 종료한다.
# ─────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '3,13,23,33,43,53 0,6,8-10,12-15,18-21,23 * * *'

  # 수동 실행 (Actions 탭에서 직접 트리거)
  workflow_dispatch:
    inputs:
      job:
        description: '실행할 작업'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - stop_check
          - crypto_stop_check
          - kr_daily_report
          - us_daily_report
          - trigger_check

# 2026-08-30: 상태 파일을 Drive 에서 읽고 쓰므로 두 실행이 겹치면 나중 것이 먼저 것을 덮어쓴다 → 직렬화
concurrency:
  group: atr-monitor
  cancel-in-progress: false

jobs:
  atr-monitor:
    runs-on: ubuntu-latest

    # stop_levels.json 변경 후 repo에 push하기 위한 쓰기 권한
    permissions:
      contents: read     # 2026-08-30: 상태 파일을 Drive 에 보관 → repo 쓰기 권한 불필요

    steps:
      # ── 1. 코드 체크아웃 ──────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python 설정 ────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. 의존성 설치 ────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 3.5 한글 폰트 설치 (차트 한글 렌더링) ─────────────
      - name: Install Korean fonts
        run: |
          sudo apt-get install -y fonts-nanum
          fc-cache -fv

      # ── 4. 실행할 작업 결정 ───────────────────────────────
      - name: Determine job type
        id: job_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "GHA_JOB=${{ inputs.job }}" >> $GITHUB_ENV
          else
            # 예약 실행은 전부 창 판정에 맡긴다. 크론 표현식 문자열로 작업 종류를
            # 고르던 방식은 표현식이 바뀔 때마다 조용히 어긋났다(커밋 153436e).
            echo "GHA_JOB=auto" >> $GITHUB_ENV
          fi

      # ── 5. ATR 모니터 실행 ────────────────────────────────
      - name: Run ATR Monitor
        env:
          # 텔레그램
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          # ── 포트폴리오 (Google Drive, 우선순위 1) ─────────────
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_PORTFOLIO_FILE_ID:    ${{ secrets.GDRIVE_PORTFOLIO_FILE_ID }}
          GDRIVE_STATE_FILE_ID:        ${{ secrets.GDRIVE_STATE_FILE_ID }}   # stop_levels.json (Drive)
          # ── 포트폴리오 (STOCK_LIST, 레거시 fallback) ──────────
          STOCK_LIST:         ${{ secrets.STOCK_LIST }}
          # 계좌 설정
          ACCOUNT_SIZE:       ${{ secrets.ACCOUNT_SIZE }}
          RISK_PER_TRADE:     ${{ secrets.RISK_PER_TRADE }}
          # 공개 로그 마스킹 솔트 (미설정 시 TELEGRAM_BOT_TOKEN 으로 폴백)
          LOG_MASK_SALT:      ${{ secrets.LOG_MASK_SALT }}
          # GitHub Actions 플래그
          GITHUB_ACTIONS:     'true'
        run: python monitor.py

      # ── 6. stop_levels.json 변경 시 커밋 & 푸시 ─────────
