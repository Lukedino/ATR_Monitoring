name: ATR Trailing Stop Monitor

# ─────────────────────────────────────────────────────────────
# 스케줄 (UTC 기준 / KST = UTC+9 / ET = UTC-5 겨울)
#
# ┌─ 전 종목 Stop 체크 (KR + US + Crypto) ──────────────────────
# │  평일 24h        : '0,30 * * * 1-5'
# │  금→토 경계      : '0,30 0-1 * * 6'   (US 애프터마켓 마감, ET 20:00까지)
# │  일→월 경계      : '0,30 23 * * 0'    (KR 프리마켓 시작, KST 08:00)
# │
# ├─ 크립토 전용 (주말 나머지 시간) ──────────────────────────────
# │  토 02:00-22:30  : '0,30 2-22 * * 6'
# │  일 00:00-22:30  : '0,30 0-22 * * 0'
# │
# ├─ 국내 일일 리포트  : KST 18:00 = UTC 09:00  (평일)
# └─ 미국+크립토 리포트 : KST 08:00 = UTC 23:00  (매일)
#
# 시장별 UTC 커버리지:
#   KR  프리+정규+시간외 : UTC 23:00~09:00  (KST 08:00~18:00)
#   US  프리+정규+애프터 : UTC 09:00~01:00  (ET  04:00~20:00)
#   진정한 비활성 구간   : UTC 01:30~09:00  (약 7.5h, 크립토만 활성)
# ─────────────────────────────────────────────────────────────
on:
  schedule:
    # 전 종목 Stop 체크 (평일 24h)
    - cron: '0,30 * * * 1-5'

    # 금→토 경계: 미국 애프터마켓 마감 커버 (토 00:00~01:30 UTC)
    - cron: '0,30 0-1 * * 6'

    # 일→월 경계: 한국 프리마켓 시작 커버 (일 23:00~23:30 UTC)
    - cron: '0,30 23 * * 0'

    # 크립토 전용 (주말 나머지 시간)
    - cron: '0,30 2-22 * * 6'   # 토 02:00~22:30 UTC
    - cron: '0,30 0-22 * * 0'   # 일 00:00~22:30 UTC

    # 국내 일일 리포트 (평일, KST 18:00 = UTC 09:00)
    - cron: '0 9 * * 1-5'

    # 미국+크립토 일일 리포트 (매일, KST 08:00 = UTC 23:00)
    - cron: '0 23 * * *'

  # 수동 실행 (Actions 탭에서 직접 트리거)
  workflow_dispatch:
    inputs:
      job:
        description: '실행할 작업'
        required: true
        default: 'stop_check'
        type: choice
        options:
          - stop_check
          - crypto_stop_check
          - kr_daily_report
          - us_daily_report
          - trigger_check

jobs:
  atr-monitor:
    runs-on: ubuntu-latest

    # stop_levels.json 변경 후 repo에 push하기 위한 쓰기 권한
    permissions:
      contents: write

    steps:
      # ── 1. 코드 체크아웃 ──────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python 설정 ────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. 의존성 설치 ────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 3.5 한글 폰트 설치 (차트 한글 렌더링) ─────────────
      - name: Install Korean fonts
        run: |
          sudo apt-get install -y fonts-nanum
          fc-cache -fv

      # ── 4. 실행할 작업 결정 ───────────────────────────────
      #   github.event.schedule 로 어떤 cron이 실행됐는지 정확히 판별
      #   (시간 파싱 방식 대비 GHA 지연 무관하게 신뢰도 높음)
      - name: Determine job type
        id: job_type
        run: |
          SCHEDULE="${{ github.event.schedule }}"

          # 수동 실행 시 입력값 우선
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "GHA_JOB=${{ inputs.job }}" >> $GITHUB_ENV

          elif [ "$SCHEDULE" = "0 9 * * 1-5" ]; then
            # KST 18:00 국내 일일 리포트
            echo "GHA_JOB=kr_daily_report" >> $GITHUB_ENV

          elif [ "$SCHEDULE" = "0 23 * * *" ]; then
            # KST 08:00 미국+크립토 일일 리포트
            echo "GHA_JOB=us_daily_report" >> $GITHUB_ENV

          elif [ "$SCHEDULE" = "0,30 2-22 * * 6" ] || [ "$SCHEDULE" = "0,30 0-22 * * 0" ]; then
            # 주말 비활성 시간대 크립토 전용 Stop 체크
            echo "GHA_JOB=crypto_stop_check" >> $GITHUB_ENV

          else
            # 전 종목 Stop 체크:
            #   '0,30 * * * 1-5'  — 평일 24h
            #   '0,30 0-1 * * 6'  — 토 새벽 (US 애프터마켓 마감)
            #   '0,30 23 * * 0'   — 일 밤  (KR 프리마켓 시작)
            echo "GHA_JOB=stop_check" >> $GITHUB_ENV
          fi

      # ── 5. ATR 모니터 실행 ────────────────────────────────
      - name: Run ATR Monitor
        env:
          # 텔레그램
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          # ── 포트폴리오 (Google Drive, 우선순위 1) ─────────────
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_PORTFOLIO_FILE_ID:    ${{ secrets.GDRIVE_PORTFOLIO_FILE_ID }}
          # ── 포트폴리오 (STOCK_LIST, 레거시 fallback) ──────────
          STOCK_LIST:         ${{ secrets.STOCK_LIST }}
          # 계좌 설정
          ACCOUNT_SIZE:       ${{ secrets.ACCOUNT_SIZE }}
          RISK_PER_TRADE:     ${{ secrets.RISK_PER_TRADE }}
          # GitHub Actions 플래그
          GITHUB_ACTIONS:     'true'
        run: python monitor.py

      # ── 6. stop_levels.json 변경 시 커밋 & 푸시 ─────────
      - name: Commit updated stop levels
        run: |
          git config user.name  "ATR Monitor Bot"
          git config user.email "atr-monitor-bot@noreply.github.com"
          # data 디렉터리가 없으면 생성 (첫 실행 대비)
          mkdir -p data
          git add data/stop_levels.json
          # 변경 없으면 커밋 건너뜀
          git diff --cached --quiet || git commit -m "chore: update ATR stop levels [skip ci]"
          # push 실패 시 (다른 run이 먼저 push한 경우) rebase 후 재시도
          git push || (git pull --rebase origin main && git push)
