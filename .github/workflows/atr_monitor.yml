name: ATR Trailing Stop Monitor

# ─────────────────────────────────────────────────────────────
# 트리거
#
# 예약 실행은 Personal Assistant 의 tick 디스패처가 맡는다(2026-09-17 이관).
#   Cloud Scheduler(5분) → PA apps/orchestrator/config/gha-schedules.json 의 `atr-*` 항목
#   → 이 워크플로를 workflow_dispatch(job=auto) 로 깨운다. 창(market_hours.ALL_WINDOWS)마다
#   창 시작 직후 1회. 항목은 dispatcher_schedules.py 가 창 정의에서 생성한다 — 창을 고치면
#   `python dispatcher_schedules.py` 로 JSON 을 다시 만들어 PA 설정에 반영한다.
#
# GitHub `schedule:` 크론은 쓰지 않는다. 배달률이 18% → 7% 로 무너져(2026-09-12·15 실측,
# 하루 84틱 중 ~6회 도착) 창 안에 틱이 하나도 안 떨어지는 날이 잦았고, 09-15 에 kr_close
# 종가 요약이 실제로 유실됐다. 되돌리려면 PA 쪽 `atr-*` 항목을 enabled:false 로 바꾸고
# 아래 `# (was) cron:` 을 schedule: 블록으로 복원한다.
# ─────────────────────────────────────────────────────────────
on:
  # (was) cron: '3,13,23,33,43,53 0,6,8-10,12-15,18-21,23 * * *'   ← 2026-09-17 까지의 GitHub 예약. 지금은 PA 디스패처.

  # 수동 실행 (Actions 탭에서 직접 트리거) + PA 디스패처(job=auto)
  workflow_dispatch:
    inputs:
      job:
        description: '실행할 작업'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - stop_check
          - crypto_stop_check
          - kr_daily_report
          - us_daily_report
          - trigger_check

# 2026-08-30: 상태 파일을 Drive 에서 읽고 쓰므로 두 실행이 겹치면 나중 것이 먼저 것을 덮어쓴다 → 직렬화
concurrency:
  group: atr-monitor
  cancel-in-progress: false

jobs:
  atr-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 상태 파일은 Drive에 저장한다. 저장소 쓰기 권한은 필요 없다.
    permissions:
      contents: read     # 2026-08-30: 상태 파일을 Drive 에 보관 → repo 쓰기 권한 불필요

    steps:
      # ── 1. 코드 체크아웃 ──────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ── 2. Python 설정 ────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. 의존성 설치 ────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 3.5 한글 폰트 설치 (차트 한글 렌더링) ─────────────
      - name: Install Korean fonts
        id: fonts
        timeout-minutes: 2
        continue-on-error: true
        run: |
          sudo apt-get install -y fonts-nanum
          fc-cache -fv

      # ── 4. 실행할 작업 결정 ───────────────────────────────
      - name: Determine job type
        id: job_type
        shell: python
        env:
          REQUEST_EVENT_NAME: ${{ github.event_name }}
          REQUESTED_JOB: ${{ inputs.job }}
        run: |
          import os
          allowed = {"auto", "stop_check", "crypto_stop_check", "kr_daily_report",
                     "us_daily_report", "trigger_check"}
          job = os.environ.get("REQUESTED_JOB", "") if os.environ.get("REQUEST_EVENT_NAME") == "workflow_dispatch" else "auto"
          if job not in allowed:
              raise SystemExit("Unsupported ATR job input")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("GHA_JOB=" + job + "\n")

      # ── 5. ATR 모니터 실행 ────────────────────────────────
      - name: Run ATR Monitor
        timeout-minutes: 20
        env:
          # 텔레그램
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          # ── 포트폴리오 (Google Drive, 우선순위 1) ─────────────
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_PORTFOLIO_FILE_ID:    ${{ secrets.GDRIVE_PORTFOLIO_FILE_ID }}
          GDRIVE_STATE_FILE_ID:        ${{ secrets.GDRIVE_STATE_FILE_ID }}   # stop_levels.json (Drive)
          # ── 포트폴리오 (STOCK_LIST, 레거시 fallback) ──────────
          STOCK_LIST:         ${{ secrets.STOCK_LIST }}
          # 계좌 설정
          ACCOUNT_SIZE:       ${{ secrets.ACCOUNT_SIZE }}
          RISK_PER_TRADE:     ${{ secrets.RISK_PER_TRADE }}
          # 공개 로그 마스킹 솔트 (미설정 시 TELEGRAM_BOT_TOKEN 으로 폴백)
          LOG_MASK_SALT:      ${{ secrets.LOG_MASK_SALT }}
          # GitHub Actions 플래그
          GITHUB_ACTIONS:     'true'
        run: python monitor.py

      # 일반 단계 실패의 보완 알림. 앱 알림과 중복될 수 있으며,
      # job 전체 취소/timeout·미시작까지 보장하는 독립 감시는 아니다.
      - name: Notify workflow failure
        if: ${{ failure() }}
        timeout-minutes: 2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_workflow_failure.py
